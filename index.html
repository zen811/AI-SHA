<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI-SHA | Vision & Sign Language Dashboard</title>

  <!-- MediaPipe JS Dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js" crossorigin="anonymous"></script>

  <!-- ONNX Runtime Web JS -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Navigation Header */
    header {
      background-color: #1e293b;
      padding: 1rem 2rem;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .status-badge {
      background-color: #334155;
      color: #94a3b8;
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 9999px;
      font-weight: 600;
    }

    .status-badge.active {
      background-color: #059669;
      color: #ecfdf5;
    }

    /* Main Dashboard Layout */
    main {
      flex: 1;
      padding: 2rem;
      max-width: 1280px;
      margin: 0 auto;
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 2rem;
    }

    @media (max-width: 960px) {
      main {
        grid-template-columns: 1fr;
      }
    }

    /* Video Feed Workspace */
    .viewport-card {
      background-color: #1e293b;
      border-radius: 16px;
      border: 1px solid #334155;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .viewport-header {
      padding: 1rem;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .viewport-container {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background-color: #020617;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #webcam, #output_canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    /* Floating Inference Banner */
    .prediction-overlay {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 12px 28px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
      z-index: 10;
    }

    .prediction-label {
      font-size: 0.875rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .prediction-value {
      font-size: 1.5rem;
      font-weight: 800;
      color: #38bdf8;
    }

    /* Side Control Panel */
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .panel-card {
      background-color: #1e293b;
      border-radius: 16px;
      border: 1px solid #334155;
      padding: 1.5rem;
    }

    .panel-card h3 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 1rem;
      color: #cbd5e1;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .metric-box {
      background-color: #0f172a;
      border-radius: 8px;
      padding: 1rem;
      border: 1px solid #334155;
    }

    .metric-title {
      font-size: 0.75rem;
      color: #64748b;
      margin-bottom: 4px;
    }

    .metric-value {
      font-size: 1.125rem;
      font-weight: 700;
      color: #f1f5f9;
    }

    .toggle-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .toggle-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.875rem;
      color: #94a3b8;
    }

    /* Custom Switch Styling */
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #334155;
      transition: .3s;
      border-radius: 24px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #2563eb;
    }

    input:checked + .slider:before {
      transform: translateX(20px);
    }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <header>
    <div class="brand">
      <h1>AI-SHA Vision System</h1>
    </div>
    <div id="statusBadge" class="status-badge">Initializing Pipeline...</div>
  </header>

  <!-- Main Content Layout -->
  <main>
    <!-- Left Workspace: Camera Stream & Overlay -->
    <div class="viewport-card">
      <div class="viewport-header">
        <span>Live Stream</span>
        <span id="fpsCounter" style="font-size: 0.875rem; color: #64748b;">FPS: --</span>
      </div>
      
      <div class="viewport-container">
        <!-- Result Overlay -->
        <div class="prediction-overlay">
          <span class="prediction-label">Detected Sign</span>
          <span id="predictionText" class="prediction-value">Waiting...</span>
        </div>

        <video id="webcam" autoplay playsinline></video>
        <canvas id="output_canvas" width="640" height="480"></canvas>
      </div>
    </div>

    <!-- Right Workspace: Diagnostics & Controls -->
    <div class="sidebar">
      <!-- Diagnostics Panel -->
      <div class="panel-card">
        <h3>Model Diagnostics</h3>
        <div class="metrics-grid">
          <div class="metric-box">
            <div class="metric-title">Landmark Count</div>
            <div id="landmarkCount" class="metric-value">225</div>
          </div>
          <div class="metric-box">
            <div class="metric-title">Engine</div>
            <div class="metric-value">ONNX Web</div>
          </div>
        </div>
      </div>

      <!-- Settings Panel -->
      <div class="panel-card">
        <h3>Pipeline Controls</h3>
        <div class="toggle-group">
          <div class="toggle-item">
            <span>Draw Pose Skeleton</span>
            <label class="switch">
              <input type="checkbox" id="togglePose" checked>
              <span class="slider"></span>
            </label>
          </div>
          <div class="toggle-item">
            <span>Draw Hand Skeletons</span>
            <label class="switch">
              <input type="checkbox" id="toggleHands" checked>
              <span class="slider"></span>
            </label>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const predictionTextEl = document.getElementById('predictionText');
    const statusBadgeEl = document.getElementById('statusBadge');
    const fpsCounterEl = document.getElementById('fpsCounter');

    const togglePose = document.getElementById('togglePose');
    const toggleHands = document.getElementById('toggleHands');

    const SIGN_DICTIONARY = {
      0: "Hello",
      1: "Thank You",
      2: "Bye",
      3: "Sorry"
    };

    let scalerSession = null;
    let modelSession = null;
    let lastFrameTime = performance.now();

    // 1. Initialize ONNX Models
    async function initONNX() {
      try {
        scalerSession = await ort.InferenceSession.create('./scaler.onnx');
        modelSession = await ort.InferenceSession.create('./model.onnx');
        
        statusBadgeEl.innerText = "Pipeline Ready";
        statusBadgeEl.classList.add('active');
        predictionTextEl.innerText = "Waiting for gesture...";
      } catch (e) {
        console.error("ONNX Initialization Error:", e);
        statusBadgeEl.innerText = "ONNX Model Load Error";
      }
    }
    initONNX();

    // 2. Exact 225-Feature Extraction Matching Python Script (33 Pose + 21 Left + 21 Right)
    function extractFeatures(results) {
      let data = [];

      // Pose: 33 points * 3 (x, y, z) = 99 features
      if (results.poseLandmarks && results.poseLandmarks.length > 0) {
        results.poseLandmarks.forEach(pt => data.push(pt.x, pt.y, pt.z));
      } else {
        data.push(...new Array(33 * 3).fill(0.0));
      }

      // Left Hand: 21 points * 3 = 63 features
      if (results.leftHandLandmarks && results.leftHandLandmarks.length > 0) {
        results.leftHandLandmarks.forEach(pt => data.push(pt.x, pt.y, pt.z));
      } else {
        data.push(...new Array(21 * 3).fill(0.0));
      }

      // Right Hand: 21 points * 3 = 63 features
      if (results.rightHandLandmarks && results.rightHandLandmarks.length > 0) {
        results.rightHandLandmarks.forEach(pt => data.push(pt.x, pt.y, pt.z));
      } else {
        data.push(...new Array(21 * 3).fill(0.0));
      }

      return data;
    }

    // 3. Perform XGBoost Inference via ONNX Session
    async function runInference(features) {
      if (!scalerSession || !modelSession) return;

      try {
        const inputTensor = new ort.Tensor('float32', Float32Array.from(features), [1, 225]);
        
        // Pass through StandardScaler ONNX
        const scaledOutput = await scalerSession.run({ float_input: inputTensor });
        const scaledTensor = scaledOutput[Object.keys(scaledOutput)[0]];

        // Pass through XGBoost ONNX
        const modelOutput = await modelSession.run({ float_input: scaledTensor });
        const labelData = modelOutput.label || modelOutput[Object.keys(modelOutput)[0]];
        const predictedClass = Number(labelData.data[0]);

        predictionTextEl.innerText = SIGN_DICTIONARY[predictedClass] || "Detecting...";
      } catch (err) {
        console.error("Inference Error:", err);
      }
    }

    // 4. MediaPipe Holistic Result Callback
    const holistic = new Holistic({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/holistic/${file}`
    });

    holistic.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    holistic.onResults((results) => {
      // Calculate FPS
      const now = performance.now();
      const fps = Math.round(1000 / (now - lastFrameTime));
      lastFrameTime = now;
      fpsCounterEl.innerText = `FPS: ${fps}`;

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      // Draw Pose Skeleton (if enabled)
      if (togglePose.checked && results.poseLandmarks) {
        drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, { color: '#00FF00', lineWidth: 3 });
        drawLandmarks(canvasCtx, results.poseLandmarks, { color: '#FF0000', lineWidth: 1, radius: 3 });
      }

      // Draw Hand Skeletons (if enabled)
      if (toggleHands.checked) {
        if (results.leftHandLandmarks) {
          drawConnectors(canvasCtx, results.leftHandLandmarks, HAND_CONNECTIONS, { color: '#38bdf8', lineWidth: 2 });
          drawLandmarks(canvasCtx, results.leftHandLandmarks, { color: '#f43f5e', lineWidth: 1, radius: 2 });
        }
        if (results.rightHandLandmarks) {
          drawConnectors(canvasCtx, results.rightHandLandmarks, HAND_CONNECTIONS, { color: '#38bdf8', lineWidth: 2 });
          drawLandmarks(canvasCtx, results.rightHandLandmarks, { color: '#f43f5e', lineWidth: 1, radius: 2 });
        }
      }

      // Feature Extraction & Classification Pipeline
      const featureArray = extractFeatures(results);
      runInference(featureArray);

      canvasCtx.restore();
    });

    // 5. Initialize Camera
    const camera = new Camera(videoElement, {
      onFrame: async () => { await holistic.send({ image: videoElement }); },
      width: 640,
      height: 480
    });

    camera.start();
  </script>
</body>
</html>
