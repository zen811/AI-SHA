<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI-SHA Real-Time Sign Language & Face Inference</title>

  <!-- MediaPipe JS Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .controls {
      margin-bottom: 16px;
      display: flex;
      gap: 12px;
    }
    button {
      background-color: #334155;
      color: white;
      border: 2px solid transparent;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    button.active {
      background-color: #2563eb;
      border-color: #60a5fa;
    }
    .video-container {
      position: relative;
      width: 640px;
      height: 480px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    /* Mirror video feed for natural interaction */
    #webcam, #output_canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 640px;
      height: 480px;
      transform: scaleX(-1);
    }
    /* Live Detected Text Display Card */
    .result-card {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 8px 24px;
      border-radius: 30px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .result-text {
      font-size: 1.25rem;
      font-weight: 700;
      color: #38bdf8;
    }
  </style>
</head>
<body>

  <h2>AI-SHA Sign Language & Vision AI</h2>

  <div class="controls">
    <button id="handBtn" class="active" onclick="setMode('hands')">Sign Detection</button>
    <button id="faceBtn" onclick="setMode('face')">Specific Face Features</button>
  </div>

  <div class="video-container">
    <!-- Real-time Phrase Output Overlay -->
    <div class="result-card">
      <span>Detected: </span>
      <span id="detectedWord" class="result-text">Waiting...</span>
    </div>

    <video id="webcam" autoplay playsinline></video>
    <canvas id="output_canvas" width="640" height="480"></canvas>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const detectedWordEl = document.getElementById('detectedWord');
    
    let activeMode = 'hands';

    // Map your custom model classification results (0..3) to text phrases
    const SIGN_DICTIONARY = {
      0: "Hello",
      1: "Thank You",
      2: "Bye",
      3: "Sorry"
    };

    // Landmark index mapping for targeted facial features
    const FEATURE_INDICES = {
      forehead: [10, 67, 297, 338, 109],
      cheeks: [116, 345, 50, 280, 205, 425],
      chin: [152, 175, 396, 200],
      ears: [234, 454, 127, 356]
    };

    // 1. Initialize MediaPipe Hands
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });
    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });
    hands.onResults(onHandResults);

    // 2. Initialize MediaPipe Face Mesh
    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });
    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });
    faceMesh.onResults(onFaceResults);

    // Rule-Based Classifier for Hand Gestures (Simulates model prediction logic in JS)
    function classifyGesture(landmarks) {
      const thumbTip = landmarks[4];
      const indexTip = landmarks[8];
      const middleTip = landmarks[12];
      const ringTip = landmarks[16];
      const pinkyTip = landmarks[20];
      
      const indexPip = landmarks[6];
      const middlePip = landmarks[10];
      const ringPip = landmarks[14];
      const pinkyPip = landmarks[18];

      // Rule checks: fingers raised (y tip < y pip joint)
      const indexUp = indexTip.y < indexPip.y;
      const middleUp = middleTip.y < middlePip.y;
      const ringUp = ringTip.y < ringPip.y;
      const pinkyUp = pinkyTip.y < pinkyPip.y;

      let result = -1;

      if (indexUp && middleUp && ringUp && pinkyUp) {
        result = 0; // "Hello" (Open Hand)
      } else if (!indexUp && !middleUp && !ringUp && !pinkyUp) {
        result = 3; // "Sorry" (Fist)
      } else if (indexUp && middleUp && !ringUp && !pinkyUp) {
        result = 2; // "Bye" (Peace / Two fingers up)
      } else if (indexUp && !middleUp && !ringUp && !pinkyUp) {
        result = 1; // "Thank You" (Pointing Up)
      }

      return result in SIGN_DICTIONARY ? SIGN_DICTIONARY[result] : "Detecting...";
    }

    // 3. Render Hand Landmarks + Perform Inference
    function onHandResults(results) {
      if (activeMode !== 'hands') return;
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        for (const landmarks of results.multiHandLandmarks) {
          drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, { color: '#00FF00', lineWidth: 3 });
          drawLandmarks(canvasCtx, landmarks, { color: '#FF0000', lineWidth: 1, radius: 3 });

          // Run gesture classification on the primary detected hand
          const detectedWord = classifyGesture(landmarks);
          detectedWordEl.innerText = detectedWord;
        }
      } else {
        detectedWordEl.innerText = "No hand detected";
      }
      canvasCtx.restore();
    }

    function drawPoint(ctx, x, y, color = '#38bdf8', radius = 4) {
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, 2 * Math.PI);
      ctx.fillStyle = color;
      ctx.fill();
    }

    // 4. Render Specific Facial Landmarks
    function onFaceResults(results) {
      if (activeMode !== 'face') return;
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        detectedWordEl.innerText = "Face Tracking Active";
        for (const landmarks of results.multiFaceLandmarks) {
          drawConnectors(canvasCtx, landmarks, FACEMESH_RIGHT_EYEBROW, { color: '#38bdf8', lineWidth: 3 });
          drawConnectors(canvasCtx, landmarks, FACEMESH_LEFT_EYEBROW, { color: '#38bdf8', lineWidth: 3 });
          drawConnectors(canvasCtx, landmarks, FACEMESH_LIPS, { color: '#f43f5e', lineWidth: 3 });

          const width = canvasElement.width;
          const height = canvasElement.height;

          Object.keys(FEATURE_INDICES).forEach(feature => {
            FEATURE_INDICES[feature].forEach(index => {
              const pt = landmarks[index];
              if (pt) {
                drawPoint(canvasCtx, pt.x * width, pt.y * height, '#f59e0b', 5);
              }
            });
          });
        }
      } else {
        detectedWordEl.innerText = "No face detected";
      }
      canvasCtx.restore();
    }

    // 5. Mode Switcher
    function setMode(mode) {
      activeMode = mode;
      document.getElementById('handBtn').classList.toggle('active', mode === 'hands');
      document.getElementById('faceBtn').classList.toggle('active', mode === 'face');
      detectedWordEl.innerText = "Waiting...";
    }

    // 6. Start Camera Feed
    const camera = new Camera(videoElement, {
      onFrame: async () => {
        if (activeMode === 'hands') {
          await hands.send({ image: videoElement });
        } else if (activeMode === 'face') {
          await faceMesh.send({ image: videoElement });
        }
      },
      width: 640,
      height: 480
    });

    camera.start();
  </script>
</body>
</html>
