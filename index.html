<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI-SHA</title>

  <!-- MediaPipe JS Libraries for Pose & Hands -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js" crossorigin="anonymous"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .video-container {
      position: relative;
      width: 640px;
      height: 480px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    /* Mirror camera stream for intuitive interaction */
    #webcam, #output_canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 640px;
      height: 480px;
      transform: scaleX(-1);
    }
    /* Result Display Overlay */
    .result-card {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 8px 24px;
      border-radius: 30px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .result-text {
      font-size: 1.25rem;
      font-weight: 700;
      color: #38bdf8;
    }
  </style>
</head>
<body>

  <h2>AI-SHA </h2>

  <div class="video-container">
    <div class="result-card">
      <span>Detected: </span>
      <span id="detectedWord" class="result-text">Waiting...</span>
    </div>

    <video id="webcam" autoplay playsinline></video>
    <canvas id="output_canvas" width="640" height="480"></canvas>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const detectedWordEl = document.getElementById('detectedWord');

    const SIGN_DICTIONARY = {
      0: "Hello",
      1: "Thank You",
      2: "Bye",
      3: "Sorry"
    };

    // 1. Initialize MediaPipe Holistic Pipeline
    const holistic = new Holistic({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/holistic/${file}`
    });

    holistic.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    holistic.onResults(onHolisticResults);

    // Classification function matching your target model rules
    function classifyGesture(landmarks) {
      const indexTip = landmarks[8];
      const middleTip = landmarks[12];
      const ringTip = landmarks[16];
      const pinkyTip = landmarks[20];

      const indexPip = landmarks[6];
      const middlePip = landmarks[10];
      const ringPip = landmarks[14];
      const pinkyPip = landmarks[18];

      const indexUp = indexTip.y < indexPip.y;
      const middleUp = middleTip.y < middlePip.y;
      const ringUp = ringTip.y < ringPip.y;
      const pinkyUp = pinkyTip.y < pinkyPip.y;

      let result = -1;

      if (indexUp && middleUp && ringUp && pinkyUp) {
        result = 0; // "Hello"
      } else if (!indexUp && !middleUp && !ringUp && !pinkyUp) {
        result = 3; // "Sorry"
      } else if (indexUp && middleUp && !ringUp && !pinkyUp) {
        result = 2; // "Bye"
      } else if (indexUp && !middleUp && !ringUp && !pinkyUp) {
        result = 1; // "Thank You"
      }

      return result in SIGN_DICTIONARY ? SIGN_DICTIONARY[result] : "Detecting...";
    }

    // 2. Process and Render Posture & Hands
    function onHolisticResults(results) {
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      // Render Body Posture Skeleton (excluding facial keypoints)
      if (results.poseLandmarks) {
        drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, { color: '#00FF00', lineWidth: 4 });
        drawLandmarks(canvasCtx, results.poseLandmarks, { color: '#FF0000', lineWidth: 2, radius: 4 });
      }

      // Render Right Hand Skeleton & Run Inference
      let activeHand = results.rightHandLandmarks || results.leftHandLandmarks;

      if (results.leftHandLandmarks) {
        drawConnectors(canvasCtx, results.leftHandLandmarks, HAND_CONNECTIONS, { color: '#38bdf8', lineWidth: 3 });
        drawLandmarks(canvasCtx, results.leftHandLandmarks, { color: '#f43f5e', lineWidth: 1, radius: 3 });
      }

      if (results.rightHandLandmarks) {
        drawConnectors(canvasCtx, results.rightHandLandmarks, HAND_CONNECTIONS, { color: '#38bdf8', lineWidth: 3 });
        drawLandmarks(canvasCtx, results.rightHandLandmarks, { color: '#f43f5e', lineWidth: 1, radius: 3 });
      }

      if (activeHand) {
        detectedWordEl.innerText = classifyGesture(activeHand);
      } else if (!results.poseLandmarks) {
        detectedWordEl.innerText = "No subject detected";
      } else {
        detectedWordEl.innerText = "Tracking Posture...";
      }

      canvasCtx.restore();
    }

    // 3. Bind Web Camera Pipeline
    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await holistic.send({ image: videoElement });
      },
      width: 640,
      height: 480
    });

    camera.start();
  </script>
</body>
</html>
